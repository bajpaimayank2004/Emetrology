name: e-Metrology Inspector Release APK
​on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]
workflow_dispatch:
​concurrency:
group: {{ github.workflow }}-{{ github.ref }}
cancel-in-progress: true
​STREAMING_CHUNK:Setting up Ubuntu runner and JDK 17 environment...
​jobs:
build-release-apk:
name: Build Android Release APK
runs-on: ubuntu-latest
timeout-minutes: 45
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Setup Java Development Kit (JDK 17)
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Setup Flutter Runtime
uses: subosito/flutter-action@v2
with:
channel: 'stable'
cache: true
​STREAMING_CHUNK:Overwriting pubspec.yaml to prevent mobile copy-paste syntax corruption...
​- name: Normalize pubspec.yaml
run: |
cat << 'EOF' > pubspec.yaml
name: emetrology_inspector
description: Statutory Compliance Audit Engine under Legal Metrology (Packaged Commodities) Rules, 2011.
publish_to: 'none'
version: 1.0.0+1
​environment:
sdk: '>=3.3.0 <4.0.0'
​dependencies:
flutter:
sdk: flutter
cupertino_icons: ^1.0.8
camera: ^0.11.0
google_mlkit_text_recognition: ^0.14.0
google_mlkit_barcode_scanning: ^0.13.0
pdf: ^3.11.1
printing: ^5.13.2
intl: ^0.19.0
path_provider: ^2.1.2
​dev_dependencies:
flutter_test:
sdk: flutter
flutter_lints: ^3.0.0
​flutter:
uses-material-design: true
EOF
​STREAMING_CHUNK:Self-scaffolding modern Android v2 embedding and Gradle wrapper...
​- name: Self-Scaffold Android v2 Embedding
run: |
echo "Purging any legacy Android project files..."
rm -rf android
echo "Generating pristine Android v2 embedding with proper Gradle wrapper..."
flutter create . --org gov.in.dca.emetrology --platforms=android
​STREAMING_CHUNK:Injecting Android camera permissions and minSdk configuration...
​- name: Inject Camera Permissions and minSdk 21
run: |
MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
echo "Configuring AndroidManifest camera permissions..."
sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>' "$MANIFEST_PATH"
​APP_BUILD_GRADLE="android/app/build.gradle"
if [ -f "$APP_BUILD_GRADLE" ]; then
echo "Enforcing minimum SDK 21 in build.gradle..."
sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$APP_BUILD_GRADLE"
sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$APP_BUILD_GRADLE"
fi
​APP_BUILD_GRADLE_KTS="android/app/build.gradle.kts"
if [ -f "$APP_BUILD_GRADLE_KTS" ]; then
echo "Enforcing minimum SDK 21 in build.gradle.kts..."
sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$APP_BUILD_GRADLE_KTS"
fi
​STREAMING_CHUNK:Resolving dependencies and compiling release APK binary...
​- name: Fetch Flutter Dependencies
run: flutter pub get
​- name: Verify Code Formatting and Diagnostics
run: flutter analyze --no-fatal-infos || true
​- name: Build Release APK
run: flutter build apk --release --no-tree-shake-icons -t lib/main.dart
​STREAMING_CHUNK:Uploading release APK artifact to GitHub Actions...
​- name: Upload Release APK Artifact
uses: actions/upload-artifact@v4
with:
name: emetrology-inspector-release-apk
path: build/app/outputs/flutter-apk/app-release.apk
retention-days: 30
if-no-files-found: error
