name: Build Release APK
​on:
push:
branches:
- main
- master
pull_request:
branches:
- main
- master
workflow_dispatch:
​concurrency:
group: "{{ github.workflow }}-{{ github.ref }}"
cancel-in-progress: true
​jobs:
build:
name: Build Android Release APK
runs-on: ubuntu-latest
timeout-minutes: 30
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Setup Java JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Setup Flutter Runtime
uses: subosito/flutter-action@v2
with:
channel: 'stable'
cache: true
​- name: Scaffold Android Project
run: rm -rf android && flutter create . --org gov.in.dca.emetrology --platforms=android
​- name: Configure Camera Permissions
run: sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' android/app/src/main/AndroidManifest.xml
​- name: Set Android Min SDK to 21
run: sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle 2>/dev/null || sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts 2>/dev/null || true
​- name: Fetch Flutter Dependencies
run: flutter pub get
​- name: Build Android Release APK
run: flutter build apk --release --no-tree-shake-icons -t lib/main.dart
​- name: Upload Release APK Artifact
uses: actions/upload-artifact@v4
with:
name: emetrology-inspector-release-apk
path: build/app/outputs/flutter-apk/app-release.apk
retention-days: 30
if-no-files-found: error
